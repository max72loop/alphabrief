{% extends "base.html" %}
{% block title %}Analyse {{ ticker }}… — MyTrader{% endblock %}

{% block page_content %}
<div class="loading-card card">
    <div class="loading-header">
        <div class="loading-spinner"></div>
        <h2>Analyse de <span class="ticker-badge">{{ ticker }}</span></h2>
        <p class="text-muted">Récupération des données en cours…</p>
    </div>

    <ul id="steps" class="steps-list"></ul>

    <p id="error-msg" class="loading-error" style="display:none"></p>
</div>
{% endblock %}

{% block scripts %}
<script>
(function () {
    const src = new EventSource("{{ url_for('detail.stream', ticker=ticker) }}");
    const steps = document.getElementById('steps');
    const errorMsg = document.getElementById('error-msg');

    src.onmessage = function (e) {
        const li = document.createElement('li');
        li.textContent = e.data;
        li.className = 'step-item';
        steps.appendChild(li);
        li.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    };

    src.addEventListener('done', function () {
        src.close();
        window.location.href = "{{ url_for('detail.show', ticker=ticker) }}";
    });

    src.addEventListener('error', function (e) {
        src.close();
        errorMsg.style.display = '';
        errorMsg.textContent = 'Erreur lors de l\'analyse : ' + (e.data || 'inconnue');
    });
})();
</script>
{% endblock %}
