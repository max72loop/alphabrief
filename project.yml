    note: "Verdict thèse 1 d'Arthur (achat BTC sur repli, dry-run) via --bilan."
  - date: "2026-10-19"
    note: "Verdict Sage v2 : bilan v1/v2 du carnet (--sage-bilan)."
  - date: "2026-11-02"
    note: "Arthur, prolongation unique : zéro entrée au 12/10 → GO (réel, petite mise) ou on coupe."
  - date: "2027-01-07"
